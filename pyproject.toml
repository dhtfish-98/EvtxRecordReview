[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evtx-record-review"
version = "0.1.1"
description = "Bounded offline EVTX integrity, BinXML and source-positioned event evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "bitfish886, with Codex AI assistance"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
evtx-record-review = "evtx_record_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
